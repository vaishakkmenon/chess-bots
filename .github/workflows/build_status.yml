# .github/workflows/build_status.yml
name: Build Status

on:
  push:
    paths:
      - "python-implementation/**"
      - "rust-implementation/**"
  pull_request:
    paths:
      - "python-implementation/**"
      - "rust-implementation/**"
  workflow_dispatch:

jobs:
  # ───────────────────────────────────────────────────────────────────────────────
  # 1) Detect which parts changed
  paths-filter:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      python-changed: ${{ steps.filter.outputs.python }}
      rust-changed: ${{ steps.filter.outputs.rust }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v2
        with:
          filters: |
            python:
              - 'python-implementation/**'
            rust:
              - 'rust-implementation/**'

  # ───────────────────────────────────────────────────────────────────────────────
  # 2) Python Tests (only if python-implementation/** changed)
  python-tests:
    name: Python 🐍 Tests
    runs-on: ubuntu-latest
    needs: paths-filter
    if: needs.paths-filter.outputs.python-changed == 'true'
    strategy:
      matrix:
        python-version: [3.13]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set PYTHONPATH so tests can import `engine`
        run: echo "PYTHONPATH=${{ github.workspace }}/python-implementation" >> $GITHUB_ENV

      - name: Run pytest
        run: pytest --maxfail=1 --disable-warnings -q

  # ───────────────────────────────────────────────────────────────────────────────
  # 3) Rust Tests (only if rust-implementation/** changed) — Canaries + Full Suite in one job
  rust-tests:
    name: Rust 🦀 Tests (canaries + full)
    runs-on: ubuntu-latest
    needs: paths-filter
    if: needs.paths-filter.outputs.rust-changed == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install rustfmt
        run: rustup component add rustfmt

      # ---- Format checks (match your old flow)
      - name: rust-cli
        working-directory: rust-implementation/rust-cli
        run: cargo fmt -- --check

      - name: rust-engine
        working-directory: rust-implementation/rust-engine
        run: cargo fmt -- --check

      # ---- FAST CANARIES (always run)
      - name: Magics canary (generator)
        working-directory: rust-implementation/rust-engine
        env:
          RUSTFLAGS: "-C debuginfo=0"
        run: |
          cargo test -p rust-engine --test magic_consistency \
            --features "deterministic-magic deterministic_zobrist" \
            -- --exact test_magic_table_consistency --test-threads=1

      - name: Magics canary (embedded)
        working-directory: rust-implementation/rust-engine
        env:
          RUSTFLAGS: "-C debuginfo=0"
        run: |
          cargo test -p rust-engine --test magic_consistency \
            --features "load-magic deterministic_zobrist" \
            -- --exact test_magic_table_consistency --test-threads=1

      # ---- FULL SUITE (embedded, deterministic)
      - name: rust-cli (release)
        working-directory: rust-implementation/rust-cli
        run: cargo test --release

      - name: rust-engine (embedded, deterministic, release)
        working-directory: rust-implementation/rust-engine
        env:
          RUSTFLAGS: "-C debug-assertions=yes -C target-cpu=native"
        run: |
          cargo test --release --features "load-magic deterministic_zobrist" -- --test-threads=1
